services:
  app:
    build: .
    container_name: pemweb_laundry_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    networks:
      - laundry-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  web:
    image: nginx:alpine
    container_name: pemweb_laundry_web
    depends_on:
      - app
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 8081:80
    restart: unless-stopped
    networks:
      - laundry-network
  db:
    image: mysql:8.0
    container_name: pemweb_laundry_db
    environment:
      MYSQL_DATABASE: db_laundry
      MYSQL_USER: pemweb
      MYSQL_PASSWORD: pemweb123
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - 3306:3306
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpassword --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - laundry-network
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: pemweb_laundry_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: pemweb
      PMA_PASSWORD: pemweb123
    ports:
      - 8082:80
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laundry-network
networks:
  laundry-network:
    driver: bridge
volumes:
  db_data:
